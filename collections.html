<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Добірки кіно та серіалів | КіноБаза</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .collection { background: #1a1a1a; padding: 25px; border-radius: 12px; margin-bottom: 30px; border-left: 5px solid #e50914; }
        .title { font-size: 24px; font-weight: bold; margin-top: 0; color: #e50914; }
        .desc { font-size: 16px; line-height: 1.6; color: #ccc; margin-bottom: 20px; }
        .movies-grid { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .movie-card { min-width: 120px; text-decoration: none; color: #fff; }
        .movie-card img { width: 100%; border-radius: 8px; transition: 0.3s; }
        .movie-card:hover img { transform: scale(1.05); border: 2px solid #e50914; }
        .movie-title { font-size: 12px; text-align: center; margin-top: 8px; font-weight: bold;}
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1 style="text-align:center; margin-bottom: 40px;">🍿 Добірки від Редакції</h1>
        <div id="loader">Шукаємо останні новини...</div>
    </div>
    
    <script>
        fetch('collections.json')
            .then(r => r.json())
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                const app = document.getElementById('app');
                data.forEach(col => {
                    let moviesHtml = col.movies.map(m => `
                        <a href="/movie/${m.id}-${m.slug}" class="movie-card">
                            <img src="${m.poster}" alt="${m.title}">
                            <div class="movie-title">${m.title}</div>
                        </a>
                    `).join('');
                    
                    app.innerHTML += `
                        <div class="collection">
                            <h2 class="title">${col.title}</h2>
                            <div class="desc">${col.description}</div>
                            <h3 style="font-size:16px;">🍿 Дивитись у цій добірці:</h3>
                            <div class="movies-grid">${moviesHtml}</div>
                        </div>
                    `;
                });
            })
            .catch(() => document.getElementById('loader').innerHTML = 'Поки що немає добірок. Зайдіть пізніше!');
    </script>
</body>
</html>
