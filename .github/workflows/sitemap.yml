name: Автоматичне оновлення Sitemap

on:
  schedule:
    - cron: '0 3 * * 1' # Запускати автоматично щопонеділка о 03:00 ночі
  workflow_dispatch: # Дозволяє запускати скрипт вручну кнопкою

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даємо дозвіл боту зберігати оновлений файл

    steps:
      - name: Завантаження коду репозиторію
        uses: actions/checkout@v4

      - name: Встановлення Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Запуск генератора sitemap.xml
        run: node generate-sitemap.js

      - name: Збереження оновленого файлу на GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          # Робимо коміт тільки якщо файл sitemap.xml реально змінився
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Авто-оновлення sitemap.xml (додано нові фільми)"
          git push
