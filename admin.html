<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КіноБаза - Адмін Панель</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e27;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1a1f3a;
        }
        .admin-header h1 {
            font-size: 28px;
            font-weight: 700;
        }
        .admin-nav {
            display: flex;
            gap: 15px;
        }
        .admin-nav a, .admin-nav button {
            padding: 8px 16px;
            background: #1a1f3a;
            color: #fff;
            border: 1px solid #2a2f4a;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .admin-nav a:hover, .admin-nav button:hover {
            background: #2a2f4a;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1a1f3a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2a2f4a;
        }
        .stat-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #e50914;
        }
        .chart-container {
            background: #1a1f3a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2a2f4a;
            margin-bottom: 30px;
        }
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        canvas { max-height: 400px; }
        .error {
            background: #2a1515;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        @media (max-width: 768px) {
            .admin-container { padding: 10px; }
            .admin-header { flex-direction: column; gap: 15px; align-items: flex-start; }
            .admin-nav { flex-wrap: wrap; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Адмін Панель КіноБази</h1>
            <div class="admin-nav">
                <a href="/">Назад на сайт</a>
                <button onclick="logout()">Вихід</button>
            </div>
        </div>

        <div id="error-msg" class="error" style="display:none;"></div>
        <div id="loading" class="loading">Завантаження статистики...</div>

        <div id="stats-section" style="display:none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Всього переглядів</div>
                    <div class="stat-value" id="total-views">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Унікальних фільмів</div>
                    <div class="stat-value" id="unique-movies">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Днів активності</div>
                    <div class="stat-value" id="active-days">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Середньо за день</div>
                    <div class="stat-value" id="avg-per-day">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Користувачів</div>
                    <div class="stat-value" id="total-users">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Рецензій</div>
                    <div class="stat-value" id="total-reviews">0</div>
                </div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Топ 20 найбільш переглянутих</div>
                <canvas id="top-movies-chart"></canvas>
            </div>

            <div class="chart-container">
                <div class="chart-title">Тренд переглядів (30 днів)</div>
                <canvas id="trend-chart"></canvas>
            </div>

            <div class="chart-container">
                <div class="chart-title">Останні 10 рецензій</div>
                <div id="reviews-list" style="max-height: 400px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1DPJw9s-k4Y4KX1oeH7eVc2Z7X8Q6wYo",
            authDomain: "kinobaza-9e1f8.firebaseapp.com",
            projectId: "kinobaza-9e1f8",
            storageBucket: "kinobaza-9e1f8.appspot.com",
            messagingSenderId: "519626748195",
            appId: "1:519626748195:web:b4e3c5f2e8c7f1a4b5c6d7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let topMoviesChart = null;
        let trendChart = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                showError('Не авторизовані');
                setTimeout(() => window.location.href = '/', 2000);
                return;
            }

            try {
                const adminRef = collection(db, 'admins');
                const adminDocs = await getDocs(adminRef);
                let isAdmin = false;
                adminDocs.forEach(doc => {
                    if (doc.id === user.uid) isAdmin = true;
                });

                if (!isAdmin) {
                    showError('Тільки адміни');
                    setTimeout(() => window.location.href = '/', 2000);
                    return;
                }

                loadStatistics();
            } catch(e) {
                console.error(e);
                showError('Помилка: ' + e.message);
            }
        });

        function showError(msg) {
            document.getElementById('error-msg').textContent = msg;
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        async function loadStatistics() {
            try {
                const viewsSnapshot = await getDocs(collection(db, 'movies_views'));
                const usersSnapshot = await getDocs(collection(db, 'users'));
                const reviewsSnapshot = await getDocs(collection(db, 'movie_reviews'));

                let totalViews = 0;
                const movieMap = {};
                const dayMap = {};

                viewsSnapshot.forEach(doc => {
                    const data = doc.data();
                    totalViews++;
                    const movieKey = `${data.movieId}`;
                    movieMap[movieKey] = (movieMap[movieKey] || 0) + 1;

                    if (data.timestamp) {
                        const date = new Date(data.timestamp.toDate ? data.timestamp.toDate() : data.timestamp);
                        const day = date.toISOString().split('T')[0];
                        dayMap[day] = (dayMap[day] || 0) + 1;
                    }
                });

                const uniqueMovies = Object.keys(movieMap).length;
                const activeDays = Object.keys(dayMap).length;
                const avgPerDay = activeDays > 0 ? Math.round(totalViews / activeDays) : 0;

                document.getElementById('total-views').textContent = totalViews;
                document.getElementById('unique-movies').textContent = uniqueMovies;
                document.getElementById('active-days').textContent = activeDays;
                document.getElementById('avg-per-day').textContent = avgPerDay;
                document.getElementById('total-users').textContent = usersSnapshot.size;
                document.getElementById('total-reviews').textContent = reviewsSnapshot.size;

                const topMovies = Object.entries(movieMap)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 20);

                renderTopMoviesChart(topMovies);

                const sortedDays = Object.keys(dayMap).sort();
                renderTrendChart(sortedDays, dayMap);

                renderReviews(Array.from(reviewsSnapshot.docs).sort((a, b) =>
                    (b.data().created_at?.toDate?.() || 0) - (a.data().created_at?.toDate?.() || 0)
                ).slice(0, 10));

                document.getElementById('loading').style.display = 'none';
                document.getElementById('stats-section').style.display = 'block';

            } catch(e) {
                console.error(e);
                showError('Помилка: ' + e.message);
            }
        }

        function renderTopMoviesChart(topMovies) {
            const ctx = document.getElementById('top-movies-chart').getContext('2d');
            if (topMoviesChart) topMoviesChart.destroy();
            topMoviesChart = new Chart(ctx, {
                type: 'barh',
                data: {
                    labels: topMovies.map(([id]) => id),
                    datasets: [{
                        label: 'Переглядів',
                        data: topMovies.map(([, count]) => count),
                        backgroundColor: '#e50914',
                        borderColor: '#ff1f27',
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#888' }, grid: { color: '#1a1f3a' } },
                        y: { ticks: { color: '#888' }, grid: { display: false } }
                    }
                }
            });
        }

        function renderTrendChart(days, dayMap) {
            const ctx = document.getElementById('trend-chart').getContext('2d');
            if (trendChart) trendChart.destroy();
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: days.slice(-30),
                    datasets: [{
                        label: 'Переглядів',
                        data: days.slice(-30).map(d => dayMap[d] || 0),
                        borderColor: '#e50914',
                        backgroundColor: 'rgba(229, 9, 20, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#e50914',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#888' } } },
                    scales: {
                        x: { ticks: { color: '#888' }, grid: { color: '#1a1f3a' } },
                        y: { ticks: { color: '#888' }, grid: { color: '#1a1f3a' } }
                    }
                }
            });
        }

        function renderReviews(reviewDocs) {
            const list = document.getElementById('reviews-list');
            if (reviewDocs.length === 0) {
                list.innerHTML = '<div style="color: #888; padding: 20px; text-align: center;">Рецензій ще немає</div>';
                return;
            }
            list.innerHTML = reviewDocs.map(doc => {
                const data = doc.data();
                const date = data.created_at?.toDate?.() ? new Date(data.created_at.toDate()).toLocaleDateString('uk-UA') : 'невідомо';
                return `
                    <div style="padding: 15px; border-bottom: 1px solid #2a2f4a;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <div style="font-weight: 600;">ID: ${data.movieId}</div>
                            <div style="color: #e50914; font-weight: 600;">★ ${data.rating}/10</div>
                        </div>
                        <div style="color: #888; font-size: 12px; margin-bottom: 8px;">${data.userName || 'Анонім'} • ${date}</div>
                        <div style="color: #bbb; font-size: 14px;">${data.reviewText || '-'}</div>
                    </div>
                `;
            }).join('');
        }

        window.logout = async function() {
            await signOut(auth);
            window.location.href = '/';
        };
    </script>
</body>
</html>
