<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адміністрування КіноБаза</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0d0d0d;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 30px; font-size: 32px; }
        .login-form {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            max-width: 400px;
            margin: 50px auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #b20710; }
        button:disabled { background: #666; cursor: not-allowed; }
        .admin-panel {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #222;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .toggle {
            width: 60px;
            height: 30px;
            background: #333;
            border-radius: 15px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
        }
        .toggle.active {
            background: #e50914;
        }
        .toggle-dot {
            width: 26px;
            height: 26px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.3s;
        }
        .toggle.active .toggle-dot {
            left: 32px;
        }
        .message {
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            display: none;
        }
        .message.show { display: block; }
        .message.success { background: #1b4f1b; color: #90ee90; }
        .message.error { background: #4f1b1b; color: #ff6b6b; }
        .logout-btn {
            background: #666;
            width: auto;
            padding: 10px 20px;
            float: right;
        }
        .clear { clear: both; }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN ФОРМА -->
        <div id="login-block">
            <h1>🔐 Адміністрування КіноБаза</h1>
            <div id="login-message" class="message"></div>
            <div class="login-form">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <button onclick="doLogin()" id="login-btn">Увійти</button>
            </div>
        </div>

        <!-- АДМІНІСТРУВАННЯ -->
        <div id="admin-block" style="display: none;">
            <div style="margin-bottom: 20px;">
                <h1>⚙️ Адміністрування</h1>
                <button class="logout-btn" onclick="doLogout()">Вихід</button>
                <div class="clear"></div>
            </div>

            <div id="admin-message" class="message"></div>

            <!-- ПЛЕЄРИ -->
            <div class="admin-panel">
                <h2>🎬 Управління плеєрами</h2>
                <div id="players-list"></div>
                <button onclick="savePlayers()" style="margin-top: 15px;">💾 Зберегти</button>
            </div>

            <!-- РЕКЛАМА -->
            <div class="admin-panel">
                <h2>📢 Налаштування реклами</h2>
                <div class="form-group">
                    <label>Monetag URL:</label>
                    <input type="text" id="monetag-url" placeholder="https://monetag.com/...">
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="ads-enabled"> Реклама увімкнена</label>
                </div>
                <button onclick="saveAds()">💾 Зберегти</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDl-Cfaskl7DSCZAg-mRAJi_qNbF_qYNyc",
            authDomain: "kinobaza-6c109.firebaseapp.com",
            projectId: "kinobaza-6c109",
            storageBucket: "kinobaza-6c109.firebasestorage.app",
            messagingSenderId: "639150355070",
            appId: "1:639150355070:web:772f863f075d4d1d839e2f",
            measurementId: "G-GKVZ2JJDJN"
        };

        let db, auth, currentUser;

        // Ініціалізуємо Firebase
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();

        console.log('✅ Firebase ініціалізовано');

        // Перевірка користувача
        setTimeout(() => {
            auth.onAuthStateChanged(user => {
                console.log('👤 Auth state changed:', user ? user.email : 'not logged in');
                if (user) {
                    checkAdminRole(user);
                } else {
                    showLoginForm();
                }
            });
        }, 500);

        function showMessage(msg, elemId, type) {
            const el = document.getElementById(elemId);
            el.textContent = msg;
            el.className = 'message show ' + type;
        }

        function showLoginForm() {
            document.getElementById('login-block').style.display = 'block';
            document.getElementById('admin-block').style.display = 'none';
        }

        function showAdminPanel() {
            document.getElementById('login-block').style.display = 'none';
            document.getElementById('admin-block').style.display = 'block';
            loadPlayers();
            loadAds();
        }

        function checkAdminRole(user) {
            db.collection('users').doc(user.uid).get().then(doc => {
                if (doc.exists && doc.data().role === 'admin') {
                    currentUser = user;
                    showAdminPanel();
                } else {
                    showMessage('❌ Тільки адміни мають доступ', 'login-message', 'error');
                    auth.signOut();
                    showLoginForm();
                }
            }).catch(e => {
                showMessage('❌ Помилка: ' + e.message, 'login-message', 'error');
            });
        }

        async function doLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');

            if (!email || !password) {
                showMessage('❌ Введи email та пароль', 'login-message', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Вхід...';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                showMessage('✅ Успіх!', 'login-message', 'success');
            } catch(e) {
                showMessage('❌ ' + e.message, 'login-message', 'error');
                btn.disabled = false;
                btn.textContent = 'Увійти';
            }
        }

        function doLogout() {
            auth.signOut();
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            showLoginForm();
        }

        function loadPlayers() {
            db.collection('settings').doc('config').get().then(doc => {
                const data = doc.data() || {};
                const disabled = data.disabledPlayers || [];

                const html = [
                    { name: 'Rendex', id: 'rendex' },
                    { name: 'Collaps', id: 'collaps' },
                    { name: 'Vidsrc', id: 'vidsrc' },
                    { name: 'Мультипошук', id: 'multisearch' }
                ].map(p => `
                    <div class="player-item">
                        <span>${p.name}</span>
                        <div class="toggle ${!disabled.includes(p.id) ? 'active' : ''}"
                             onclick="togglePlayer(this, '${p.id}')">
                            <div class="toggle-dot"></div>
                        </div>
                    </div>
                `).join('');

                document.getElementById('players-list').innerHTML = html;
            });
        }

        function togglePlayer(el, id) {
            el.classList.toggle('active');
        }

        async function savePlayers() {
            const toggles = document.querySelectorAll('.toggle');
            const disabled = [];

            const ids = ['rendex', 'collaps', 'vidsrc', 'multisearch'];
            toggles.forEach((el, idx) => {
                if (!el.classList.contains('active')) {
                    disabled.push(ids[idx]);
                }
            });

            try {
                await db.collection('settings').doc('config').update({
                    disabledPlayers: disabled
                });
                showMessage('✅ Плеєри збережені', 'admin-message', 'success');
            } catch(e) {
                showMessage('❌ ' + e.message, 'admin-message', 'error');
            }
        }

        function loadAds() {
            db.collection('settings').doc('config').get().then(doc => {
                const data = doc.data() || {};
                document.getElementById('monetag-url').value = data.monetagUrl || '';
                document.getElementById('ads-enabled').checked = data.playerAdsEnabled !== false;
            });
        }

        async function saveAds() {
            try {
                await db.collection('settings').doc('config').update({
                    monetagUrl: document.getElementById('monetag-url').value,
                    playerAdsEnabled: document.getElementById('ads-enabled').checked
                });
                showMessage('✅ Реклама збережена', 'admin-message', 'success');
            } catch(e) {
                showMessage('❌ ' + e.message, 'admin-message', 'error');
            }
        }

        // Показуємо login форму при завантаженні
        console.log('🚀 Admin panel завантажено');
        showLoginForm();
    </script>
</body>
</html>
